[package]
name = "proc-safety"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["ulquiorracode <ulquiorrascifferofficial@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Zero-cost internal process self-defense, memory boundaries, and OS kernel mitigation policies"
readme = "README.md"
repository = "https://github.com/ulquiorracode/proc-safety-rs"

[features]
default = ["std"]
std = []
stitch = ["dep:stitch-core"]

[dependencies]
thiserror = "2.0"
stitch-core = { git = "https://github.com/ulquiorracode/stitch-rs.git", branch = "main", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_Security",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "baseline_bench"
harness = false
required-features = ["stitch"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
